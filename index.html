<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星屑パスポート / 恋するオルゴール</title>
    <style>
        /* =========================================
           Special Thanks オープニング（流れ星演出）
        ========================================= */
        #splash-screen {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: linear-gradient(135deg, #1a0b2e, #4b1d52, #e57373);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            z-index: 9999; 
            transition: opacity 1.5s ease;
            overflow: hidden;
        }

        /* 流れ星アニメーション */
        .shooting-star {
            position: absolute; 
            width: 100px; 
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,1), rgba(255,255,255,0));
            animation: shooting 2s linear infinite;
        }
        .star1 { top: 20%; left: -100px; animation-delay: 0s; }
        .star2 { top: 40%; left: -100px; animation-delay: 0.8s; }
        .star3 { top: 60%; left: -100px; animation-delay: 1.5s; }

        @keyframes shooting {
            0% { transform: translateX(0) translateY(0) rotate(-30deg); opacity: 1; }
            100% { transform: translateX(120vw) translateY(60vh) rotate(-30deg); opacity: 0; }
        }

        .splash-thanks { 
            font-size: 2.4rem; 
            font-style: italic; 
            letter-spacing: 6px; 
            margin-bottom: 15px; 
            color: #fff; 
            font-family: 'Georgia', 'Times New Roman', serif;
            z-index: 10;
        }
        
        .splash-sub {
            font-size: 0.95rem;
            letter-spacing: 4px;
            margin-bottom: 30px;
            color: #fff;
            opacity: 0.9;
            z-index: 10;
        }

        .splash-main { 
            font-size: 2.8rem; 
            font-weight: bold; 
            letter-spacing: 2px; 
            color: #fff; 
            text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
            z-index: 10;
        }

        /* =========================================
           LP全体のデザイン（ストロベリーピンクとホワイト基調）
        ========================================= */
        body {
            margin: 0; 
            padding: 0; 
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #ffe6f2 0%, #ffcce6 50%, #ffffff 100%);
            color: #4a4a4a; 
            text-align: center; 
            min-height: 100vh;
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 30px 20px; 
        }

        .hero { 
            margin: 10px 0 30px 0; 
        }

        .jacket-img {
            width: 100%; 
            height: auto; 
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(255,153,204,0.4);
            display: block; 
            border: 2px solid rgba(255,255,255,0.8);
        }

        /* セクション（可愛らしいガラスモーフィズム） */
        .section {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px; 
            padding: 35px 25px; 
            margin: 30px 0;
            box-shadow: 0 10px 30px rgba(255, 153, 204, 0.2);
            position: relative; 
            overflow: hidden;
        }

        .section::before {
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 0; 
            right: 0; 
            height: 4px;
            background: linear-gradient(90deg, #ff99cc, #ff66a3);
        }

        .section h2 { 
            font-size: 1.4rem; 
            margin-top: 0; 
            margin-bottom: 20px; 
            letter-spacing: 1px; 
            color: #ff66a3; 
        }

        .media-wrapper {
            position: relative; 
            width: 100%; 
            padding-top: 56.5%;
            background: #ffe6f2; 
            border-radius: 10px; 
            overflow: hidden; 
            margin-bottom: 15px;
            border: 1px dashed #ff99cc;
        }

        .media-wrapper iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
        
        .story-text {
            text-align: left; 
            line-height: 1.9; 
            font-size: 0.95rem; 
            color: #4a4a4a;
        }

        /* =========================================
           制作秘話リンク用追加スタイル
        ========================================= */
        .youtube-link {
            display: block;
            margin-top: 20px;
            text-decoration: none;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        
        .youtube-link:hover {
            transform: scale(1.03);
            filter: brightness(1.05);
        }

        .secret-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(255,153,204,0.4);
            border: 2px solid rgba(255, 153, 204, 0.8);
        }

        .link-text {
            text-align: center;
            color: #ff66a3;
            margin-top: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
        }

        footer { 
            padding: 40px 0; 
            font-size: 0.8rem; 
            letter-spacing: 1px; 
            color: #ff99cc; 
        }
    </style>
</head>
<body>

    <!-- オープニング演出（流れ星） -->
    <div id="splash-screen">
        <div class="shooting-star star1"></div>
        <div class="shooting-star star2"></div>
        <div class="shooting-star star3"></div>
        <div class="splash-thanks">Special Thanks</div>
        <div class="splash-sub">For All Purchasers</div>
        <div class="splash-main">星屑パスポート</div>
    </div>

    <!-- メインLP -->
    <div class="container">
        <header class="hero">
            <!-- ※お手元のジャケット画像のファイル名に合わせて変更してください -->
            <img src="ジャケット画像のファイル名.png" alt="星屑パスポート ジャケット写真" class="jacket-img">
        </header>

        <section class="section">
            <h2>🎵 楽曲を聴く</h2>
            <div style="padding: 40px; background: rgba(255,204,229,0.3); border-radius: 10px; border: 1px dashed #ff99cc;">
                <p style="opacity: 0.8; font-size: 0.9rem;">（ここに「星屑パスポート」の音源プレイヤーが入ります）</p>
            </div>
        </section>

        <section class="section">
            <h2>💃 みんなで踊ろう振付動画</h2>
            <div class="media-wrapper">
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff99cc;">
                    振付動画 準備中
                </div>
            </div>
            <p style="font-size: 0.9rem; margin-top: 15px; color: #666;">サビの振付を覚えて一緒に踊ろう！</p>
        </section>

        <section class="section">
            <h2>📖 制作秘話</h2>
            <div class="story-text">
                <p>デビュー曲『星屑パスポート』の感想などなど、恋オルファン必見の裏話を大公開！</p>
                
                <!-- 画像リンクエリア -->
                <a href="https://youtu.be/wwAPJI-d3TM" target="_blank" rel="noopener noreferrer" class="youtube-link">
                    <img src="ChatGPT Image 2026年8月18日 13_28_52.png" alt="恋するオルゴール デビュー秘話" class="secret-img">
                    <div class="link-text">▶︎ 制作秘話の動画を見る</div>
                </a>
            </div>
        </section>

        <footer>&copy; オタクのいちごさん All Rights Reserved.</footer>
    </div>

    <!-- 自動切り替えスクリプト（2秒後にフェードアウト） -->
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => { 
                    splash.style.display = 'none'; 
                }, 1500);
            }, 2000); 
        });
    </script>
</body>
</html>
