<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋するオルゴール - 限定特典ページ</title>
    <style>
        /* ==========================================================================
           デザイン設定（カラー・フォントなど）
           ========================================================================== */
        :root {
            --bg-dark: #0a0e17;      /* 深いネイビー・夜空 */
            --bg-box: #1a120b;       /* ダークブラウン・アンティーク木目調 */
            --gold-primary: #d4af37; /* 真鍮・ゴールド */
            --gold-light: #f3e5ab;   /* アイボリー・温かみのある光 */
            --text-main: #f5f5f4;    /* メイン文字色（少し温かみのある白） */
            --text-sub: #b5a48c;     /* サブ文字色（アンティークベージュ） */
        }

        /* 全体リセット & ベーススタイル */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Times New Roman', 'Noto Serif JP', 'Shippori Mincho', serif;
            line-height: 1.8;
            letter-spacing: 0.08em;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 粒子（星屑）の背景レイヤー */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ==========================================================================
           オープニング演出（オルゴールの蓋が開く・フェードイン）
           ========================================================================== */
        #opening-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 2.0s ease, transform 2.0s ease;
            transform-origin: top center; /* 蓋が上に開くようなイメージ */
        }

        #opening-overlay.fade-out {
            opacity: 0;
            transform: scaleY(0);
            pointer-events: none;
        }

        .opening-box {
            text-align: center;
            color: var(--gold-primary);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* ==========================================================================
           メインコンテンツ・レイアウト
           ========================================================================== */
        .wrapper {
            position: relative;
            z-index: 10;
            max-width: 500px; /* スマホ閲覧に最適な横幅 */
            margin: 0 auto;
            padding: 40px 20px 80px 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 2.5s ease 0.5s, transform 2.5s ease 0.5s;
        }

        .wrapper.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* セクション共通 */
        section {
            background: linear-gradient(135deg, #1f160e 0%, var(--bg-box) 100%);
            border: 1px solid rgba(212, 175, 55, 0.25); /* 繊細な真鍮フレーム */
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 0 15px rgba(212,175,55,0.05);
            border-radius: 8px;
            padding: 30px 20px;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }

        /* 装飾的なコーナーライン（高級感を演出） */
        section::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px solid rgba(212, 175, 55, 0.05);
            border-radius: 6px;
            pointer-events: none;
        }

        h2 {
            font-size: 1.1rem;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h2::before, h2::after {
            content: '♦';
            font-size: 0.6rem;
            margin: 0 10px;
            color: var(--gold-primary);
            opacity: 0.7;
        }

        /* ① TOP セクション */
        .jacket-area {
            position: relative;
            width: 85%;
            margin: 0 auto 25px auto;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .jacket-area img {
            width: 100%;
            display: block;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .main-title {
            font-size: 1.6rem;
            color: var(--gold-light);
            text-shadow: 0 0 10px rgba(243, 229, 171, 0.3);
            margin-bottom: 15px;
            font-weight: normal;
        }

        .catchphrase {
            font-size: 0.85rem;
            color: var(--text-sub);
            white-space: pre-wrap; /* 改行を反映 */
        }

        /* ② MUSIC & ③ MV ボタン・動画エリア */
        .btn-gold {
            display: inline-block;
            width: 90%;
            max-width: 280px;
            padding: 14px 0;
            background: linear-gradient(135deg, #d4af37 0%, #aa841e 100%);
            color: #1a120b;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 40px;
            box-shadow: 0 4px 15px rgba(214,175,55,0.3);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            letter-spacing: 0.15em;
        }

        .btn-gold:active {
            transform: scale(0.97);
            box-shadow: 0 2px 5px rgba(214,175,55,0.2);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 アスペクト比 */
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        .coming-soon {
            font-size: 1rem;
            color: var(--text-sub);
            font-style: italic;
            letter-spacing: 0.15em;
            padding: 20px 0;
        }

        /* ④ MESSAGE セクション */
        .message-text {
            font-size: 0.9rem;
            text-align: left;
            padding: 0 10px;
            white-space: pre-wrap;
            color: var(--text-main);
        }

        /* ⑤ SECRET CONTENTS セクション */
        .secret-list {
            list-style: none;
            text-align: left;
            padding: 0 10px;
        }

        .secret-item {
            font-size: 0.85rem;
            padding: 12px 0;
            border-bottom: 1px dashed rgba(214, 175, 55, 0.15);
            color: var(--text-sub);
            display: flex;
            align-items: center;
        }

        .secret-item::before {
            content: '✦';
            color: var(--gold-primary);
            margin-right: 10px;
            font-size: 0.75rem;
        }

        .secret-item:last-child {
            border-bottom: none;
        }

        /* フッター */
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-sub);
            opacity: 0.5;
            margin-top: 20px;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <!-- 粒子背景レイヤー -->
    <canvas id="particles"></canvas>

    <!-- オープニング演出用オーバーレイ -->
    <div id="opening-overlay">
        <div class="opening-box">
            <p style="font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 10px;">Premium Special Page</p>
            <div style="font-size: 1.5rem; font-weight: 300;">Loading...</div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="wrapper" id="main-wrapper">
        
        <!-- ① TOP SECTION -->
        <section id="sec-top">
            <div class="jacket-area">
                <!-- JavaScriptで差し替え -->
                <img id="lp-jacket" src="" alt="Jacket Image">
            </div>
            <h1 class="main-title" id="lp-title">---</h1>
            <p class="catchphrase" id="lp-catchphrase">---</p>
        </section>

        <!-- ② MUSIC SECTION -->
        <section id="sec-music">
            <h2>Music</h2>
            <!-- JavaScriptでボタンまたは埋め込み動画を自動生成 -->
            <div id="music-content"></div>
        </section>

        <!-- ③ MUSIC VIDEO SECTION -->
        <section id="sec-mv">
            <h2>Music Video</h2>
            <div id="mv-content"></div>
        </section>

        <!-- ④ MESSAGE SECTION -->
        <section id="sec-message">
            <h2>Message</h2>
            <p class="message-text" id="lp-message">---</p>
        </section>

        <!-- ⑤ SECRET CONTENTS SECTION -->
        <section id="sec-secret">
            <h2>Secret Contents</h2>
            <ul class="secret-list" id="lp-secret-list">
                <!-- JavaScriptで動的に追加 -->
            </ul>
        </section>

        <footer>
            &copy; <span id="current-year"></span> Premium Music Card. All Rights Reserved.
        </footer>
    </div>

    <!-- ==========================================================================
       JavaScript（データ管理 ＆ 演出ロジック）
       ========================================================================== -->
    <script>
        /* ----------------------------------------------------------------------
           【今後の運用・保守用：データ設定エリア】
           ※新しい楽曲に展開する際は、以下の内容を書き換えるだけで完了します。
           ---------------------------------------------------------------------- */
        const CONFIG = {
            title: "恋するオルゴール",
            catchphrase: "あなたへ贈る、小さな音楽の贈り物。", 
            
            // ジャケット画像のパス (GitHub Pagesにアップロードしたファイル名、または絶対URL)
            // 例: "jacket_koisuru.jpg" など。現在はサンプルとして同じ階層の「image.png」を指定しています
            jacketUrl: "image.png", 

            // ② MUSIC (YouTubeの限定公開動画URL、または通常動画のURL)
            // ボタン形式で別タブで開かせたい場合は、ここにURLを設定します
            musicYoutubeUrl: "https://www.youtube.com/watch?v=xxxxxxxxx",

            // ③ MUSIC VIDEO (公開前は "" のままにすると自動的に「Coming Soon...」になります)
            // URLを入れると、ページ内に自動でYouTubeの「埋め込みプレイヤー」が表示されます
            mvYoutubeUrl: "", // 例: "https://www.youtube.com/watch?v=yyyyyyyyy"

            // ④ ARTIST MESSAGE
            message: `このカードを手に取ってくださり、本当にありがとうございます。

この「恋するオルゴール」は、大切な人への想いや、心の奥にある優しい記憶をそっと呼び覚ますような、温もりある世界観を大切に作りました。

オルゴールのネジを巻くときのような、ドキドキする特別な瞬間を、このページを通して何度も楽しんでいただけたら嬉しいです。`,

            // ⑤ SECRET CONTENTS (今後追加したい項目を配列で自由に追加・削除可能)
            secretItems: [
                "限定アザージャケット写真（近日公開予定）",
                "レコーディング密着メイキング映像",
                "「恋するオルゴール」セルフライナーノーツ（制作秘話）",
                "メンバーからの手書きスペシャルメッセージボード"
            ]
        };

        /* ----------------------------------------------------------------------
           システム処理（変更不要のパーツ）
           ---------------------------------------------------------------------- */
        
        // 1. データのページへの反映
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("lp-title").innerText = CONFIG.title;
            document.title = `${CONFIG.title} - 限定特典ページ`;
            document.getElementById("lp-catchphrase").innerText = CONFIG.catchphrase;
            document.getElementById("lp-jacket").src = CONFIG.jacketUrl;
            document.getElementById("lp-message").textContent = CONFIG.message;
            document.getElementById("current-year").innerText = new Date().getFullYear();

            // MUSICコンテンツの生成 (YouTubeリンクボタン)
            const musicContent = document.getElementById("music-content");
            if(CONFIG.musicYoutubeUrl) {
                const btn = document.createElement("a");
                btn.href = CONFIG.musicYoutubeUrl;
                btn.target = "_blank";
                btn.className = "btn-gold";
                btn.innerText = "楽曲を聴く";
                musicContent.appendChild(btn);
            }

            // MVコンテンツの生成 (Coming Soon ⇄ 埋め込みプレイヤー切り替え)
            const mvContent = document.getElementById("mv-content");
            if (CONFIG.mvYoutubeUrl) {
                // YouTubeのURLからVideo IDを抽出
                let videoId = "";
                const url = CONFIG.mvYoutubeUrl;
                if(url.includes("v=")) {
                    videoId = url.split("v=")[1].split("&")[0];
                } else if(url.includes("youtu.be/")) {
                    videoId = url.split("youtu.be/")[1].split("?")[0];
                }
                
                if(videoId) {
                    mvContent.className = "video-container";
                    mvContent.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                } else {
                    mvContent.innerHTML = `<div class="coming-soon">Coming Soon...</div>`;
                }
            } else {
                mvContent.innerHTML = `<div class="coming-soon">Coming Soon...</div>`;
            }

            // シークレットコンテンツの生成
            const secretList = document.getElementById("lp-secret-list");
            CONFIG.secretItems.forEach(item => {
                const li = document.createElement("li");
                li.className = "secret-item";
                li.innerText = item;
                secretList.appendChild(li);
            });

            // 2. オープニング演出のトリガー（読み込み後1秒後にフェードアウト開始）
            setTimeout(() => {
                const overlay = document.getElementById("opening-overlay");
                const wrapper = document.getElementById("main-wrapper");
                
                overlay.classList.add("fade-out");
                wrapper.classList.add("visible");
            }, 1000);
        });

        /* 3. 幻想的な「優しく漂う星屑・光の粒子」アニメーション (Canvas) */
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');

        let dots = [];
        const maxDots = 25; // 重くならないように粒子数を最適化

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Dot {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height + canvas.height; // 画面下から湧き上がる
                this.size = Math.random() * 1.5 + 0.5;
                this.speedY = Math.random() * 0.4 + 0.1; // 優しく漂う速度
                this.speedX = Math.sin(Math.random() * 2) * 0.2;
                this.alpha = Math.random() * 0.5 + 0.2;
                this.fadeSpeed = Math.random() * 0.005 + 0.002;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                // 上に行くほど、または時間経過でランダムにフェードアウト
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(243, 229, 171, ${this.alpha})`; // アイボリー・ゴールドの光
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#d4af37';
                ctx.fill();
            }
        }

        // 粒子初期化
        for (let i = 0; i < maxDots; i++) {
            let d = new Dot();
            d.y = Math.random() * canvas.height; // 初回は画面全体に散らす
            dots.push(d);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach(d => {
                d.update();
                d.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
